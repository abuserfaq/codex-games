<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Go 9x9</title>
  <link rel="icon" href="./assets/stone-black.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../styles.css">
</head>
<body>
  <main class="shell game-shell">
    <nav class="topbar" aria-label="Навигация по играм"><a class="brand" href="../../index.html">Каталог игр</a><div class="menu" data-common-menu></div></nav>
    <header class="game-header"><h1>Go 9x9</h1><p>Займите дыхание соперника, окружайте территорию и оставляйте на доске только живые группы.</p></header>
    <section class="statusbar go-hud" role="status"><span id="turn">Ход чёрных</span><span>Снято: <strong id="blackCaps">0</strong> / <strong id="whiteCaps">0</strong></span><span id="message">Поставьте камень на пересечение.</span><button class="button" id="restart" type="button">Заново</button></section>
    <section class="play-panel go-wrap" aria-label="Доска Go 9x9"><div id="board" class="go-board" role="grid" aria-label="Игровая доска Go"></div><img class="asset-preload" src="./assets/go-board.svg" alt=""><img class="asset-preload" src="./assets/stone-black.svg" alt=""><img class="asset-preload" src="./assets/stone-white.svg" alt=""></section>
    <section class="statusbar go-controls" aria-label="Управление Go"><button class="button" id="pass" type="button">Пас</button><button class="button" id="score" type="button">Подсчёт</button><span class="hint">Кликните пересечение. Два паса завершают партию; белым добавлено коми 6,5.</span></section>
  </main>
  <script>
    const menu=[['tic-tac-toe.html','Крестики-нолики'],['snake/index.html','Змейка'],['pong/index.html','Pong'],['breakout/index.html','Breakout'],['minesweeper/index.html','Сапер'],['space-invaders/index.html','Space Invaders'],['15-puzzle/index.html','15 Puzzle'],['memory-match/index.html','Memory Match'],['simon/index.html','Simon'],['frogger/index.html','Frogger'],['hangman/index.html','Hangman'],['asteroids/index.html','Asteroids'],['tetris/index.html','Tetris'],['whac-a-mole/index.html','Whac-A-Mole'],['lunar-lander/index.html','Lunar Lander'],['connect-four/index.html','Connect Four'],['centipede/index.html','Centipede'],['kaboom/index.html','Kaboom!'],['pac-man/index.html','Pac-Man'],['missile-command/index.html','Missile Command'],['sokoban/index.html','Sokoban'],['reversi/index.html','Reversi'],['qix/index.html','Qix Claim'],['lights-out/index.html','Lights Out'],['mastermind/index.html','Mastermind'],['pipe-dream/index.html','Pipe Dream'],['dots-and-boxes/index.html','Dots and Boxes'],['same-game/index.html','SameGame'],['nim-sticks/index.html','Nim Sticks'],['peg-solitaire/index.html','Peg Solitaire'],['battleship-radar/index.html','Battleship Radar'],['hanoi/index.html','Tower of Hanoi'],['mancala/index.html','Mancala'],['blackjack-21/index.html','Blackjack 21'],['yahtzee/index.html','Yahtzee'],['nonogram/index.html','Nonogram'],['word-search/index.html','Word Search'],['rush-hour/index.html','Rush Hour'],['gem-swap/index.html','Gem Swap'],['pocket-pinball/index.html','Pocket Pinball'],['marble-maze/index.html','Marble Maze'],['shut-the-box/index.html','Shut the Box'],['checkers/index.html','Checkers'],['domino-trail/index.html','Domino Trail'],['cannon-duel/index.html','Cannon Duel'],['royal-ur/index.html','Royal Game of Ur'],['solitaire/index.html','Klondike Solitaire'],['mahjong-solitaire/index.html','Mahjong Solitaire'],['sea-wolf/index.html','Sea Wolf'],['mini-golf/index.html','Mini Golf'],['color-flood/index.html','Color Flood'],['nine-mens-morris/index.html',"Nine Men's Morris"],['twenty-forty-eight/index.html','2048'],['pyramid-hopper/index.html','Pyramid Hopper'],['fox-and-geese/index.html','Fox and Geese'],['boulder-dash/index.html','Boulder Dash Pocket'],['hex/index.html','Hex'],['light-cycles/index.html','Light Cycles'],['hunt-the-wumpus/index.html','Hunt the Wumpus'],['sky-joust/index.html','Sky Joust'],['tapper-counter/index.html','Tapper Counter'],['night-driver/index.html','Night Driver'],['donkey-climb/index.html','Donkey Climb'],['ski-slalom/index.html','Ski Slalom'],['bomb-squad/index.html','Bomb Squad'],['knights-tour/index.html',"Knight's Tour"],['klotski-escape/index.html','Klotski Escape'],['sudoku/index.html','Sudoku'],['ludo/index.html','Ludo'],['quoridor/index.html','Quoridor'],['go-9x9/index.html','Go 9x9'],['pig-dice/index.html','Pig Dice'],['chomp/index.html','Chomp']];
    document.querySelector('[data-common-menu]').innerHTML=menu.map(([href,label])=>`<a href="../${href}"${href==='go-9x9/index.html'?' aria-current="page"':''}>${label}</a>`).join('');
    const N=9, boardEl=document.querySelector('#board'), turnEl=document.querySelector('#turn'), message=document.querySelector('#message'), blackCaps=document.querySelector('#blackCaps'), whiteCaps=document.querySelector('#whiteCaps');
    let state;
    const clone=b=>b.map(row=>row.slice()), same=(a,b)=>a.every((row,r)=>row.every((v,c)=>v===b[r][c]));
    const neighbors=(r,c)=>[[r-1,c],[r+1,c],[r,c-1],[r,c+1]].filter(([y,x])=>y>=0&&y<N&&x>=0&&x<N);
    function group(board,r,c){const color=board[r][c], seen=new Set([`${r},${c}`]), stones=[], liberties=new Set(), q=[[r,c]];while(q.length){const [y,x]=q.pop();stones.push([y,x]);neighbors(y,x).forEach(([ny,nx])=>{if(!board[ny][nx])liberties.add(`${ny},${nx}`);else if(board[ny][nx]===color&&!seen.has(`${ny},${nx}`)){seen.add(`${ny},${nx}`);q.push([ny,nx]);}});}return {stones,liberties};}
    function applyMove(source,r,c,color){if(source[r][c])return null;const b=clone(source);b[r][c]=color;let captured=0;neighbors(r,c).forEach(([ny,nx])=>{if(b[ny][nx]&&b[ny][nx]!==color){const g=group(b,ny,nx);if(!g.liberties.size){g.stones.forEach(([y,x])=>b[y][x]=0);captured+=g.stones.length;}}});if(!group(b,r,c).liberties.size)return null;return {b,captured};}
    function territory(b){const seen=new Set(), out={black:0,white:0};for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(b[r][c]||seen.has(`${r},${c}`))continue;const q=[[r,c]], region=[], borders=new Set();seen.add(`${r},${c}`);while(q.length){const [y,x]=q.pop();region.push([y,x]);neighbors(y,x).forEach(([ny,nx])=>{if(!b[ny][nx]&&!seen.has(`${ny},${nx}`)){seen.add(`${ny},${nx}`);q.push([ny,nx]);}else if(b[ny][nx])borders.add(b[ny][nx]);});}if(borders.size===1)out[borders.has(1)?'black':'white']+=region.length;}return out;}
    function finalScore(){const t=territory(state.board), stones=state.board.flat();const black=stones.filter(x=>x===1).length+t.black+state.caps.black, white=stones.filter(x=>x===2).length+t.white+state.caps.white+6.5;return {black,white,t};}
    function reset(){state={board:Array.from({length:N},()=>Array(N).fill(0)),turn:1,caps:{black:0,white:0},previous:null,passes:0,over:false};message.textContent='Поставьте камень на пересечение.';render();}
    function play(r,c){if(state.over)return false;const next=applyMove(state.board,r,c,state.turn);if(!next){message.textContent='Этот ход оставляет группу без дыханий.';render();return false;}if(state.previous&&same(next.b,state.previous)){message.textContent='Ко: нельзя сразу повторить прежнюю позицию.';render();return false;}state.previous=clone(state.board);state.board=next.b;state.caps[state.turn===1?'black':'white']+=next.captured;state.turn=3-state.turn;state.passes=0;message.textContent=next.captured?`Снято камней: ${next.captured}.`:'Теперь очередь соперника.';render();return true;}
    function finish(){state.over=true;const s=finalScore(), winner=s.black>s.white?'Чёрные':'Белые';message.textContent=`${winner} выигрывают: ${s.black} : ${s.white}. Территория ${s.t.black}/${s.t.white}.`;render();}
    function pass(){if(state.over)return;state.passes++;state.turn=3-state.turn;if(state.passes>=2)finish();else{message.textContent='Пас. Второй пас завершит партию.';render();}}
    function render(){turnEl.textContent=state.over?'Партия завершена':`Ход ${state.turn===1?'чёрных':'белых'}`;blackCaps.textContent=state.caps.black;whiteCaps.textContent=state.caps.white;boardEl.innerHTML='';for(let r=0;r<N;r++)for(let c=0;c<N;c++){const button=document.createElement('button');button.type='button';button.className='go-point '+(!state.board[r][c]&&!state.over?'open':'');button.setAttribute('role','gridcell');button.setAttribute('aria-label',`Пересечение ${r+1}, ${c+1}${state.board[r][c]===1?', чёрный камень':state.board[r][c]===2?', белый камень':''}`);if(state.board[r][c])button.innerHTML=`<i class="go-stone ${state.board[r][c]===1?'black':'white'}"></i>`;else button.onclick=()=>play(r,c);boardEl.append(button);}}
    document.querySelector('#restart').onclick=reset;document.querySelector('#pass').onclick=pass;document.querySelector('#score').onclick=finish;window.__goTest={applyMove,group,territory,finalScore,play,pass,reset,state:()=>JSON.parse(JSON.stringify(state))};reset();
  </script>
</body>
</html>
