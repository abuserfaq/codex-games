<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chomp</title><link rel="icon" href="./assets/poison-seal.svg" type="image/svg+xml"><link rel="stylesheet" href="../../styles.css"></head><body><main class="shell game-shell">
<nav class="topbar" aria-label="Навигация по играм"><a class="brand" href="../../index.html">Каталог игр</a><div class="menu" data-common-menu></div></nav>
<header class="game-header"><h1>Chomp</h1><p>Шоколадная дуэль. Последний кусочек — отравлен.</p></header>
<section class="statusbar" role="status"><strong id="turn">Ваш ход</strong><span id="message">Выберите кусочек.</span><button class="button" id="restart" type="button">Заново</button></section>
<section class="play-panel chomp-wrap" aria-label="Шоколадная плитка"><div class="chomp-label">CHOMP <span>70% CACAO · 100% STRATEGY</span></div><div id="board" class="chomp-board" aria-label="Плитка 5 на 6"></div><div class="chomp-footer">ОСТЕРЕГАЙТЕСЬ УГОЛКА <span>×</span></div></section>
<p class="hint chomp-hint">Нажмите кусочек: исчезнет он и всё справа и ниже.<br>Кто возьмёт красный уголок, проиграет. Вы начинаете.</p>
</main><script>
const menu=[['tic-tac-toe.html','Крестики-нолики'],['snake/index.html','Змейка'],['pong/index.html','Pong'],['breakout/index.html','Breakout'],['minesweeper/index.html','Сапер'],['space-invaders/index.html','Space Invaders'],['15-puzzle/index.html','15 Puzzle'],['memory-match/index.html','Memory Match'],['simon/index.html','Simon'],['frogger/index.html','Frogger'],['hangman/index.html','Hangman'],['asteroids/index.html','Asteroids'],['tetris/index.html','Tetris'],['whac-a-mole/index.html','Whac-A-Mole'],['lunar-lander/index.html','Lunar Lander'],['connect-four/index.html','Connect Four'],['centipede/index.html','Centipede'],['kaboom/index.html','Kaboom!'],['pac-man/index.html','Pac-Man'],['missile-command/index.html','Missile Command'],['sokoban/index.html','Sokoban'],['reversi/index.html','Reversi'],['qix/index.html','Qix Claim'],['lights-out/index.html','Lights Out'],['mastermind/index.html','Mastermind'],['pipe-dream/index.html','Pipe Dream'],['dots-and-boxes/index.html','Dots and Boxes'],['same-game/index.html','SameGame'],['nim-sticks/index.html','Nim Sticks'],['peg-solitaire/index.html','Peg Solitaire'],['battleship-radar/index.html','Battleship Radar'],['hanoi/index.html','Tower of Hanoi'],['mancala/index.html','Mancala'],['blackjack-21/index.html','Blackjack 21'],['yahtzee/index.html','Yahtzee'],['nonogram/index.html','Nonogram'],['word-search/index.html','Word Search'],['rush-hour/index.html','Rush Hour'],['gem-swap/index.html','Gem Swap'],['pocket-pinball/index.html','Pocket Pinball'],['marble-maze/index.html','Marble Maze'],['shut-the-box/index.html','Shut the Box'],['checkers/index.html','Checkers'],['domino-trail/index.html','Domino Trail'],['cannon-duel/index.html','Cannon Duel'],['royal-ur/index.html','Royal Game of Ur'],['solitaire/index.html','Klondike Solitaire'],['mahjong-solitaire/index.html','Mahjong Solitaire'],['sea-wolf/index.html','Sea Wolf'],['mini-golf/index.html','Mini Golf'],['color-flood/index.html','Color Flood'],['nine-mens-morris/index.html',"Nine Men's Morris"],['twenty-forty-eight/index.html','2048'],['pyramid-hopper/index.html','Pyramid Hopper'],['fox-and-geese/index.html','Fox and Geese'],['boulder-dash/index.html','Boulder Dash Pocket'],['hex/index.html','Hex'],['light-cycles/index.html','Light Cycles'],['hunt-the-wumpus/index.html','Hunt the Wumpus'],['sky-joust/index.html','Sky Joust'],['tapper-counter/index.html','Tapper Counter'],['night-driver/index.html','Night Driver'],['donkey-climb/index.html','Donkey Climb'],['ski-slalom/index.html','Ski Slalom'],['bomb-squad/index.html','Bomb Squad'],['knights-tour/index.html',"Knight's Tour"],['klotski-escape/index.html','Klotski Escape'],['sudoku/index.html','Sudoku'],['ludo/index.html','Ludo'],['quoridor/index.html','Quoridor'],['go-9x9/index.html','Go 9x9'],['pig-dice/index.html','Pig Dice'],['chomp/index.html','Chomp']];
document.querySelector('[data-common-menu]').innerHTML=menu.map(([href,label])=>`<a href="../${href}"${href==='chomp/index.html'?' aria-current="page"':''}>${label}</a>`).join('');
const board=document.querySelector('#board'),message=document.querySelector('#message'),turn=document.querySelector('#turn');
let rows, busy=false,over=false,timer;
function bite(state,r,c){return state.map((n,i)=>i>=r?Math.min(n,c):n);}
function moves(state){const result=[];state.forEach((n,r)=>{for(let c=0;c<n;c++)if(r||c)result.push([r,c]);});return result;}
const memo=new Map();
function winning(state){const key=state.join(',');if(memo.has(key))return memo.get(key);const result=moves(state).some(([r,c])=>!winning(bite(state,r,c)));memo.set(key,result);return result;}
function preview(r,c){board.querySelectorAll('button').forEach(b=>b.classList.toggle('bite-preview',Number(b.dataset.r)>=r&&Number(b.dataset.c)>=c));}
function render(){board.innerHTML='';for(let r=0;r<5;r++)for(let c=0;c<6;c++){const b=document.createElement('button');b.type='button';b.className='chomp-piece'+(!r&&!c?' poison':'');b.dataset.r=r;b.dataset.c=c;b.disabled=c>=rows[r]||busy||over;b.classList.toggle('eaten',c>=rows[r]);b.setAttribute('aria-label',`${!r&&!c?'Отравленный уголок':'Кусочек'}: ряд ${r+1}, столбец ${c+1}`);b.addEventListener('pointerenter',()=>{if(!b.disabled)preview(r,c);});b.addEventListener('focus',()=>preview(r,c));b.addEventListener('blur',()=>preview(9,9));b.addEventListener('click',()=>play(r,c));board.append(b);}}
board.addEventListener('pointerleave',()=>preview(9,9));
function play(r,c){if(busy||over||c>=rows[r])return;if(!r&&!c){finish(false);return;}rows=bite(rows,r,c);busy=true;turn.textContent='Ход соперника';message.textContent='Соперник выбирает кусочек…';render();timer=setTimeout(cpuTurn,550);}
function cpuTurn(){const options=moves(rows);if(!options.length){finish(true);return;}const choice=options.find(([r,c])=>!winning(bite(rows,r,c)))||options[Math.floor(Math.random()*options.length)];rows=bite(rows,...choice);busy=false;turn.textContent='Ваш ход';message.textContent='Выберите кусочек.';render();}
function finish(won){over=true;busy=false;turn.textContent=won?'Вы победили!':'Победа соперника';message.textContent=won?'Сопернику остался отравленный уголок.':'Вы взяли отравленный уголок.';render();}
function restart(){clearTimeout(timer);rows=[6,6,6,6,6];busy=false;over=false;turn.textContent='Ваш ход';message.textContent='Выберите кусочек.';render();}
document.querySelector('#restart').addEventListener('click',restart);
window.__chompTest={bite,moves,winning,getState:()=>({rows:[...rows],busy,over})};restart();
</script></body></html>
