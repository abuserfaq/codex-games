<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Green dice table felt">
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="17"/>
      <feColorMatrix type="saturate" values=".15"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .18"/>
