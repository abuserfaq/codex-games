<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pig Dice</title>
  <link rel="icon" href="./assets/pig-seal.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../styles.css">
</head>
<body>
  <main class="shell game-shell">
    <nav class="topbar" aria-label="Навигация по играм"><a class="brand" href="../../index.html">Каталог игр</a><div class="menu" data-common-menu></div></nav>
    <header class="game-header"><h1>Pig Dice</h1><p>Бросайте, накапливайте и вовремя забирайте очки — единица сжигает весь ход.</p></header>
    <section class="statusbar pig-hud" role="status"><span id="turn">Ваш ход</span><span>За ход: <strong id="turnScore">0</strong></span><span id="message">Бросьте кубик или заберите очки.</span><button class="button" id="restart" type="button">Заново</button></section>
    <section class="play-panel pig-wrap" aria-label="Игровой стол Pig Dice"><div class="pig-table"><div class="pig-score you">ВЫ<strong id="youScore">0</strong></div><button class="pig-die" id="die" type="button" aria-label="Кубик: нажмите, чтобы бросить"></button><div class="pig-score cpu">СОПЕРНИК<strong id="cpuScore">0</strong></div><i class="pig-seal" aria-hidden="true"></i></div><img class="asset-preload" src="./assets/dice-tray.svg" alt=""><img class="asset-preload" src="./assets/die-ruby.svg" alt=""><img class="asset-preload" src="./assets/pig-seal.svg" alt=""></section>
    <section class="statusbar pig-controls" aria-label="Управление Pig Dice"><button class="button pig-roll" id="roll" type="button">Бросить</button><button class="button pig-bank" id="bank" type="button">Забрать очки</button><span class="hint">Клавиши: пробел — бросить, Enter — забрать. Наберите 100 раньше соперника.</span></section>
  </main>
  <script>
    const menu=[['tic-tac-toe.html','Крестики-нолики'],['snake/index.html','Змейка'],['pong/index.html','Pong'],['breakout/index.html','Breakout'],['minesweeper/index.html','Сапер'],['space-invaders/index.html','Space Invaders'],['15-puzzle/index.html','15 Puzzle'],['memory-match/index.html','Memory Match'],['simon/index.html','Simon'],['frogger/index.html','Frogger'],['hangman/index.html','Hangman'],['asteroids/index.html','Asteroids'],['tetris/index.html','Tetris'],['whac-a-mole/index.html','Whac-A-Mole'],['lunar-lander/index.html','Lunar Lander'],['connect-four/index.html','Connect Four'],['centipede/index.html','Centipede'],['kaboom/index.html','Kaboom!'],['pac-man/index.html','Pac-Man'],['missile-command/index.html','Missile Command'],['sokoban/index.html','Sokoban'],['reversi/index.html','Reversi'],['qix/index.html','Qix Claim'],['lights-out/index.html','Lights Out'],['mastermind/index.html','Mastermind'],['pipe-dream/index.html','Pipe Dream'],['dots-and-boxes/index.html','Dots and Boxes'],['same-game/index.html','SameGame'],['nim-sticks/index.html','Nim Sticks'],['peg-solitaire/index.html','Peg Solitaire'],['battleship-radar/index.html','Battleship Radar'],['hanoi/index.html','Tower of Hanoi'],['mancala/index.html','Mancala'],['blackjack-21/index.html','Blackjack 21'],['yahtzee/index.html','Yahtzee'],['nonogram/index.html','Nonogram'],['word-search/index.html','Word Search'],['rush-hour/index.html','Rush Hour'],['gem-swap/index.html','Gem Swap'],['pocket-pinball/index.html','Pocket Pinball'],['marble-maze/index.html','Marble Maze'],['shut-the-box/index.html','Shut the Box'],['checkers/index.html','Checkers'],['domino-trail/index.html','Domino Trail'],['cannon-duel/index.html','Cannon Duel'],['royal-ur/index.html','Royal Game of Ur'],['solitaire/index.html','Klondike Solitaire'],['mahjong-solitaire/index.html','Mahjong Solitaire'],['sea-wolf/index.html','Sea Wolf'],['mini-golf/index.html','Mini Golf'],['color-flood/index.html','Color Flood'],['nine-mens-morris/index.html',"Nine Men's Morris"],['twenty-forty-eight/index.html','2048'],['pyramid-hopper/index.html','Pyramid Hopper'],['fox-and-geese/index.html','Fox and Geese'],['boulder-dash/index.html','Boulder Dash Pocket'],['hex/index.html','Hex'],['light-cycles/index.html','Light Cycles'],['hunt-the-wumpus/index.html','Hunt the Wumpus'],['sky-joust/index.html','Sky Joust'],['tapper-counter/index.html','Tapper Counter'],['night-driver/index.html','Night Driver'],['donkey-climb/index.html','Donkey Climb'],['ski-slalom/index.html','Ski Slalom'],['bomb-squad/index.html','Bomb Squad'],['knights-tour/index.html',"Knight's Tour"],['klotski-escape/index.html','Klotski Escape'],['sudoku/index.html','Sudoku'],['ludo/index.html','Ludo'],['quoridor/index.html','Quoridor'],['go-9x9/index.html','Go 9x9'],['pig-dice/index.html','Pig Dice']];
    document.querySelector('[data-common-menu]').innerHTML=menu.map(([href,label])=>`<a href="../${href}"${href==='pig-dice/index.html'?' aria-current="page"':''}>${label}</a>`).join('');
    const target=100, turnEl=document.querySelector('#turn'), turnScoreEl=document.querySelector('#turnScore'), youEl=document.querySelector('#youScore'), cpuEl=document.querySelector('#cpuScore'), message=document.querySelector('#message'), die=document.querySelector('#die'), rollButton=document.querySelector('#roll'), bankButton=document.querySelector('#bank');
    let state;
    function randomDie(){return Math.floor(Math.random()*6)+1;}
    function reset(){state={you:0,cpu:0,turn:0,player:'you',over:false,last:5};message.textContent='Бросьте кубик или заберите очки.';render();}
    function render(){const mine=state.player==='you';turnEl.textContent=state.over?'Партия завершена':mine?'Ваш ход':'Ход соперника';turnScoreEl.textContent=state.turn;youEl.textContent=state.you;cpuEl.textContent=state.cpu;die.classList.remove('rolling','bust');void die.offsetWidth;die.classList.add('rolling');die.style.setProperty('--face',state.last);die.setAttribute('aria-label',`Кубик: выпало ${state.last}`);rollButton.disabled=!mine||state.over;bankButton.disabled=!mine||state.over||state.turn===0;die.disabled=!mine||state.over;}
    function winner(){return state.you>=target?'Вы':state.cpu>=target?'Соперник':'';}
    function endIfWon(){const who=winner();if(!who)return false;state.over=true;message.textContent=`${who} набирает ${target} и побеждает!`;render();return true;}
    function roll(value=randomDie()){if(state.over||state.player!=='you')return false;state.last=value;if(value===1){state.turn=0;message.textContent='Единица! Очки хода сгорели — соперник бросает.';render();setTimeout(cpuTurn,620);return false;}state.turn+=value;message.textContent=`Выпало ${value}. Рискнёте ещё раз или заберёте ${state.turn}?`;render();return true;}
    function bank(){if(state.over||state.player!=='you'||!state.turn)return false;state.you+=state.turn;state.turn=0;if(endIfWon())return true;state.player='cpu';message.textContent='Вы забрали очки. Соперник думает…';render();setTimeout(cpuTurn,520);return true;}
    function cpuTurn(){if(state.over)return;state.player='cpu';let subtotal=0;const step=()=>{const value=randomDie();state.last=value;if(value===1){state.turn=0;state.player='you';message.textContent='Соперник выбросил единицу. Ваш ход.';render();return;}subtotal+=value;state.turn=subtotal;const needs=(state.cpu+subtotal>=target), holds=needs||subtotal>=15||(subtotal>=10&&Math.random()<.45);if(holds){state.cpu+=subtotal;state.turn=0;if(endIfWon())return;state.player='you';message.textContent=`Соперник забирает ${subtotal}. Ваш ход.`;render();return;}message.textContent=`Соперник рискует: ${subtotal} за ход…`;render();setTimeout(step,420);};setTimeout(step,150);}
    document.querySelector('#restart').onclick=reset;rollButton.onclick=()=>roll();die.onclick=()=>roll();bankButton.onclick=bank;document.addEventListener('keydown',event=>{if(event.code==='Space'){event.preventDefault();roll();}if(event.key==='Enter'){event.preventDefault();bank();}});window.__pigTest={reset,roll,bank,cpuTurn,state:()=>({...state}),setDie:randomDie=>{window.__pigRandom=randomDie}};reset();
  </script>
</body>
</html>
