  <path d="M600 207h-96c-23 0-41 18-41 41s18 41 41 41h96" fill="none" stroke="#f3efe0" stroke-width="10" stroke-linecap="round" opacity=".78"/>
  <path d="M548 231l36 17-36 17" fill="none" stroke="#f3efe0" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
</svg>
