<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="painted city road grid">
  <defs>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#263a3d"/>
      <stop offset="1" stop-color="#172527"/>
    </linearGradient>
    <pattern id="lane" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0v100" fill="none" stroke="#5f7370" stroke-width="4" opacity=".46"/>
      <path d="M50 8v24M50 68v24M8 50h24M68 50h24" fill="none" stroke="#f5d46a" stroke-width="5" stroke-linecap="round" opacity=".72"/>
