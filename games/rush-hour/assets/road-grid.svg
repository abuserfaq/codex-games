    <radialGradient id="light" cx=".34" cy=".22" r=".82">
      <stop offset="0" stop-color="#5f7a76" stop-opacity=".5"/>
      <stop offset=".52" stop-color="#2d4444" stop-opacity=".1"/>
      <stop offset="1" stop-color="#071112" stop-opacity=".55"/>
