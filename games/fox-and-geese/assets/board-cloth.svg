      <stop offset="0" stop-color="#284b38"/>
      <stop offset=".52" stop-color="#173427"/>
      <stop offset="1" stop-color="#0c2019"/>
    </linearGradient>
    <pattern id="weave" width="34" height="34" patternUnits="userSpaceOnUse">
