<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ludo</title>
  <link rel="icon" href="./assets/token-red.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../styles.css">
</head>
<body>
  <main class="shell game-shell">
    <nav class="topbar" aria-label="Навигация по играм">
      <a class="brand" href="../../index.html">Каталог игр</a>
      <div class="menu" data-common-menu></div>
    </nav>
    <header class="game-header"><h1>Ludo</h1><p>Бросайте кость, выводите фишки из дома и проведите их к золотой звезде раньше синего соперника.</p></header>
    <section class="statusbar ludo-hud" role="status"><span>Кость: <strong id="die">—</strong></span><span>Красные дома: <strong id="redOff">0</strong>/4</span><span>Синие дома: <strong id="blueOff">0</strong>/4</span><span id="message">Ваш ход — бросьте кость.</span><button class="button" id="restart" type="button">Заново</button></section>
    <section class="play-panel ludo-wrap" aria-label="Доска Ludo"><div class="ludo-board" id="board"></div><img class="asset-preload" src="./assets/board-inlay.svg" alt=""><img class="asset-preload" src="./assets/token-red.svg" alt=""><img class="asset-preload" src="./assets/token-blue.svg" alt=""></section>
    <section class="statusbar ludo-controls" aria-label="Управление Ludo"><button class="button ludo-roll" id="roll" type="button">Бросить кость</button><span class="hint">Нужна 6, чтобы выйти из дома. Выберите подсвеченную красную фишку; 6 даёт ещё один бросок.</span></section>
  </main>
  <script>
    const menu = [
      ['tic-tac-toe.html','Крестики-нолики'],['snake/index.html','Змейка'],['pong/index.html','Pong'],['breakout/index.html','Breakout'],['minesweeper/index.html','Сапер'],['space-invaders/index.html','Space Invaders'],['15-puzzle/index.html','15 Puzzle'],['memory-match/index.html','Memory Match'],['simon/index.html','Simon'],['frogger/index.html','Frogger'],['hangman/index.html','Hangman'],['asteroids/index.html','Asteroids'],['tetris/index.html','Tetris'],['whac-a-mole/index.html','Whac-A-Mole'],['lunar-lander/index.html','Lunar Lander'],['connect-four/index.html','Connect Four'],['centipede/index.html','Centipede'],['kaboom/index.html','Kaboom!'],['pac-man/index.html','Pac-Man'],['missile-command/index.html','Missile Command'],['sokoban/index.html','Sokoban'],['reversi/index.html','Reversi'],['qix/index.html','Qix Claim'],['lights-out/index.html','Lights Out'],['mastermind/index.html','Mastermind'],['pipe-dream/index.html','Pipe Dream'],['dots-and-boxes/index.html','Dots and Boxes'],['same-game/index.html','SameGame'],['nim-sticks/index.html','Nim Sticks'],['peg-solitaire/index.html','Peg Solitaire'],['battleship-radar/index.html','Battleship Radar'],['hanoi/index.html','Tower of Hanoi'],['mancala/index.html','Mancala'],['blackjack-21/index.html','Blackjack 21'],['yahtzee/index.html','Yahtzee'],['nonogram/index.html','Nonogram'],['word-search/index.html','Word Search'],['rush-hour/index.html','Rush Hour'],['gem-swap/index.html','Gem Swap'],['pocket-pinball/index.html','Pocket Pinball'],['marble-maze/index.html','Marble Maze'],['shut-the-box/index.html','Shut the Box'],['checkers/index.html','Checkers'],['domino-trail/index.html','Domino Trail'],['cannon-duel/index.html','Cannon Duel'],['royal-ur/index.html','Royal Game of Ur'],['solitaire/index.html','Klondike Solitaire'],['mahjong-solitaire/index.html','Mahjong Solitaire'],['sea-wolf/index.html','Sea Wolf'],['mini-golf/index.html','Mini Golf'],['color-flood/index.html','Color Flood'],['nine-mens-morris/index.html',"Nine Men's Morris"],['twenty-forty-eight/index.html','2048'],['pyramid-hopper/index.html','Pyramid Hopper'],['fox-and-geese/index.html','Fox and Geese'],['boulder-dash/index.html','Boulder Dash Pocket'],['hex/index.html','Hex'],['light-cycles/index.html','Light Cycles'],['hunt-the-wumpus/index.html','Hunt the Wumpus'],['sky-joust/index.html','Sky Joust'],['tapper-counter/index.html','Tapper Counter'],['night-driver/index.html','Night Driver'],['donkey-climb/index.html','Donkey Climb'],['ski-slalom/index.html','Ski Slalom'],['bomb-squad/index.html','Bomb Squad'],['knights-tour/index.html',"Knight's Tour"],['klotski-escape/index.html','Klotski Escape'],['sudoku/index.html','Sudoku'],['ludo/index.html','Ludo']
    ];
    document.querySelector('[data-common-menu]').innerHTML = menu.map(([href,label]) => `<a href="../${href}"${href === 'ludo/index.html' ? ' aria-current="page"' : ''}>${label}</a>`).join('');
    const board = document.querySelector('#board'), die = document.querySelector('#die'), redOff = document.querySelector('#redOff'), blueOff = document.querySelector('#blueOff'), message = document.querySelector('#message'), rollButton = document.querySelector('#roll');
    const path = [[6,1],[6,2],[6,3],[6,4],[6,5],[5,5],[4,5],[3,5],[2,5],[1,5],[1,6],[1,7],[1,8],[2,8],[3,8],[4,8],[5,8],[5,9],[5,10],[5,11],[5,12],[6,12],[7,12],[8,12],[9,12],[9,11],[9,10],[9,9],[9,8],[10,8],[11,8],[12,8],[12,7],[12,6],[12,5],[11,5],[10,5],[9,5],[8,5],[7,5]];
    const lanes = { red:[[7,1],[7,2],[7,3],[7,4]], blue:[[7,11],[7,10],[7,9],[7,8]] };
    const homes = { red:[[2,2],[2,4],[4,2],[4,4]], blue:[[10,10],[10,12],[12,10],[12,12]] };
    let state;
    const pieces = side => state[side];
    const finish = side => pieces(side).filter(p => p === 44).length;
    function reset() { state = { red:[-1,-1,-1,-1], blue:[-1,-1,-1,-1], turn:'red', roll:null, over:false, msg:'Ваш ход — бросьте кость.' }; render(); }
    function cellFor(side,pos) { if (pos < 0 || pos >= 44) return null; if (pos < 40) return path[(pos + (side === 'blue' ? 20 : 0)) % 40]; return lanes[side][pos - 40]; }
    function legal(side=state.turn, value=state.roll) { if (!value || state.over) return []; return pieces(side).map((pos,index) => { const next=pos<0 ? (value===6 ? 0 : -99) : pos+value; return next >= 0 && next <= 44 ? {index,next} : null; }).filter(Boolean); }
    function move(side,index) { const entry=legal(side).find(m => m.index===index); if (!entry) return false; pieces(side)[index]=entry.next; if (entry.next < 40) { const target=cellFor(side,entry.next).join(','); const other=side==='red'?'blue':'red'; pieces(other).forEach((p,i) => { if (p >= 0 && p < 40 && cellFor(other,p).join(',')===target && ![0,10,20,30].includes(entry.next)) pieces(other)[i]=-1; }); }
      if (finish(side)===4) { state.over=true; state.msg=side==='red'?'Все фишки дома — победа!':'Синий соперник финишировал первым.'; state.roll=null; render(); return true; }
      const extra=state.roll===6; state.roll=null; state.turn=extra?side:(side==='red'?'blue':'red'); state.msg=extra?(side==='red'?'Шесть — бросьте ещё раз.':'Синий выбросил шесть.'):state.turn==='red'?'Ваш ход — бросьте кость.':'Синий бросает кость.'; render(); if (!state.over && state.turn==='blue') setTimeout(aiTurn, 520); return true; }
    function roll(value) { if (state.over || state.turn!=='red' || state.roll!==null) return; state.roll=value || 1+Math.floor(Math.random()*6); const moves=legal(); state.msg=moves.length?'Выберите подсвеченную красную фишку.':'Нет хода — синий бросает кость.'; render(); if (!moves.length) { state.roll=null; state.turn='blue'; setTimeout(aiTurn,560); } }
    function aiTurn(value) { if (state.over) return; state.turn='blue'; state.roll=value || 1+Math.floor(Math.random()*6); const moves=legal('blue'); if (!moves.length) { state.roll=null; state.turn='red'; state.msg='Синему некуда идти. Ваш ход.'; render(); return; } const pick=moves.slice().sort((a,b)=>b.next-a.next)[0]; state.msg=`Синий выбросил ${state.roll}.`; render(); setTimeout(()=>move('blue',pick.index),420); }
    function render() { die.textContent=state.roll ?? '—'; redOff.textContent=finish('red'); blueOff.textContent=finish('blue'); message.textContent=state.msg; rollButton.disabled=state.turn!=='red'||state.roll!==null||state.over; board.innerHTML='<div class="ludo-grid"></div>'; const grid=board.firstElementChild; const occupancy={}; ['red','blue'].forEach(side=>pieces(side).forEach((p,i)=>{ if (p === 44) return; const at=cellFor(side,p) || homes[side][i]; const key=at.join(','); (occupancy[key] ||= []).push({side,i,p}); }));
      for(let r=0;r<14;r++) for(let c=0;c<14;c++){ const button=document.createElement('button'); button.type='button'; const key=`${r},${c}`, tokenList=occupancy[key]||[]; const track=path.some(([x,y])=>x===r&&y===c), lane=Object.values(lanes).some(list=>list.some(([x,y])=>x===r&&y===c)); button.className=`ludo-cell${track?' track':''}${lane?' lane':''}${r<6&&c<6?' red-base':''}${r>7&&c>7?' blue-base':''}${[6,1,1,6,6,12,12,8].some(()=>false)?'':''}`; if (track && [[6,1],[1,5],[5,12],[12,8]].some(([x,y])=>x===r&&y===c)) button.classList.add('safe'); tokenList.forEach(t=>{ const can=t.side==='red' && legal().some(m=>m.index===t.i); const dot=document.createElement('span'); dot.className=`ludo-token ${t.side}${can?' playable':''}`; dot.setAttribute('aria-label',`${t.side==='red'?'Красная':'Синяя'} фишка ${t.i+1}`); button.append(dot); if(can) button.addEventListener('click',()=>move('red',t.i)); }); button.disabled=!tokenList.some(t=>t.side==='red'&&legal().some(m=>m.index===t.i)); grid.append(button); }
    }
    document.querySelector('#restart').addEventListener('click',reset); rollButton.addEventListener('click',()=>roll()); window.__ludoTest={reset,roll,move,legal,aiTurn,state:()=>JSON.parse(JSON.stringify(state))}; reset();
  </script>
</body></html>
